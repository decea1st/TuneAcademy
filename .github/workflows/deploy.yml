name: Deploy

# Every push to main: run the checks, build the image, then restart the app on Lightsail with it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer push waits for the running deploy instead of cutting it off.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/decea1st/tuneacademy

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ secrets.LIGHTSAIL_HOST }}
      SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          # tr: a key pasted from Windows can carry \r line endings, which ssh rejects.
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Copy the compose file and Caddyfile
        run: |
          ssh -i ~/.ssh/lightsail "ubuntu@$HOST" 'mkdir -p tuneacademy'
          scp -i ~/.ssh/lightsail deploy/docker-compose.prod.yml deploy/Caddyfile "ubuntu@$HOST:tuneacademy/"
      # The server logs in to GitHub's registry with this run's token, which expires when the run ends.
      - name: Pull the new image and restart
        run: |
          echo "$REGISTRY_TOKEN" | ssh -i ~/.ssh/lightsail "ubuntu@$HOST" "
            docker login ghcr.io -u '$REGISTRY_USER' --password-stdin &&
            cd tuneacademy &&
            docker compose -f docker-compose.prod.yml pull app &&
            docker compose -f docker-compose.prod.yml up -d &&
            docker image prune -f"

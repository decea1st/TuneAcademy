name: Checks

# Every pull request, and every deploy first (deploy.yml calls this workflow).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The tests start their own Postgres with Testcontainers, using the runner's Docker.
      - run: ./mvnw -B test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Trivy reads the Maven dependency versions from the local Maven cache (--offline-scan).
      # Left to itself it fetches them from Maven Central one by one, which gets rate-limited.
      - run: ./mvnw -B -q dependency:go-offline
        working-directory: backend
      # Fails on any high or critical vulnerability that has a fix, in the npm or Maven dependencies.
      - run: >-
          docker run --rm -v "$PWD:/src" -v "$HOME/.m2:/root/.m2" aquasec/trivy:0.76.2
          fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --offline-scan --exit-code 1 /src

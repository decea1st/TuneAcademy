# Production settings, on top of application.properties. SPRING_PROFILES_ACTIVE=prod turns them on
# (deploy/docker-compose.prod.yml sets it). Passwords come from environment variables, never from git;
# with no default, the app refuses to start if one is missing.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# The login cookie is only ever sent over HTTPS.
server.servlet.session.cookie.secure=true
# Caddy handles HTTPS and forwards plain HTTP. Trusting its X-Forwarded-* headers tells Spring the
# original request was HTTPS, so the CSRF cookie is marked Secure too.
server.forward-headers-strategy=native

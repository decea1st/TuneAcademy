spring.application.name=backend

# Local Postgres from docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/tuneacademy
spring.datasource.username=tuneacademy
spring.datasource.password=tuneacademy

# Flyway owns the tables. Hibernate only checks at startup that each entity matches its table.
spring.jpa.hibernate.ddl-auto=validate
# Close the database connection when the request handler finishes, not after the response is written.
spring.jpa.open-in-view=false

# Login session cookie (JSESSIONID). http-only: JavaScript can't read it, so injected scripts
# can't steal it. same-site=lax: other websites can't attach it to their POST requests.
# (Secure, HTTPS-only, gets turned on in production.)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Stay logged in for 7 days, including across browser restarts.
server.servlet.session.timeout=7d
server.servlet.session.cookie.max-age=7d

# Errors come back as JSON with a "detail" message React can show (e.g. "Incorrect email or password.").
spring.mvc.problemdetails.enabled=true

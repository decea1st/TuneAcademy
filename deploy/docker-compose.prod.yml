# Production: the app, Postgres and Caddy (HTTPS) on one server.
# Reads DOMAIN and DB_PASSWORD from a .env file next to this one, which only exists on the server.
name: tuneacademy

services:
  app:
    image: ghcr.io/decea1st/tuneacademy:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/tuneacademy
      DB_USER: tuneacademy
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuneacademy
      POSTGRES_USER: tuneacademy
      # Only used when the database volume is first created; changing it later doesn't change the password.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuneacademy -d tuneacademy"]
      interval: 5s
      timeout: 5s
      retries: 12

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # the HTTPS certificates; keeping them avoids asking for new ones on every restart
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
